          import json
          import re

          LEVELS = {"低", "中", "高"}

          def strip_fence(text):
              value = (text or "").strip()
              value = re.sub(r"^```(?:json)?\s*", "", value, flags=re.I)
              value = re.sub(r"\s*```$", "", value)
              a, b = value.find("{"), value.rfind("}")
              return value[a:b+1] if a >= 0 and b > a else value

          def in_chunk(excerpt, text):
              norm = lambda x: re.sub(r"\s+", "", str(x or ""))
              return bool(excerpt) and norm(excerpt) in norm(text)

          def main(raw_analysis: str, chunk: dict, knowledge_result: list) -> dict:
              sources = []
              for item in knowledge_result or []:
                  if not isinstance(item, dict):
                      continue
                  meta = item.get("metadata") or {}
                  sources.append({
                      "title": str(meta.get("document_name") or meta.get("title") or item.get("title") or "未命名资料"),
                      "content": str(item.get("content") or "")[:1200],
                      "metadata": meta
                  })
              try:
                  parsed = json.loads(strip_fence(raw_analysis))
                  risks = parsed.get("risks", [])
                  if not isinstance(risks, list):
                      raise ValueError("risks 不是数组")
              except Exception as exc:
                  payload = {
                      "chunk_id": (chunk or {}).get("chunk_id", "UNKNOWN"),
                      "analysis_status": "failed",
                      "failure_reason": "模型 JSON 解析失败：%s" % exc,
                      "risks": [],
                      "extracted_elements": {},
                      "retrieval_trace": sources,
                      "needs_manual_review": True
                  }
                  return {"result_json": json.dumps(payload, ensure_ascii=False)}

              normalized = []
              chunk_text = str((chunk or {}).get("text") or "")
              for idx, risk in enumerate(risks[:30], 1):
                  if not isinstance(risk, dict):
                      continue
                  level = risk.get("risk_level") if risk.get("risk_level") in LEVELS else "中"
                  excerpt = str(risk.get("original_excerpt") or "")[:1200]
                  excerpt_ok = in_chunk(excerpt, chunk_text)
                  bases = []
                  unverified = False
                  for base in (risk.get("legal_bases") or [])[:8]:
                      if not isinstance(base, dict):
                          continue
                      title = str(base.get("title") or "")
                      quote = str(base.get("source_quote") or "")
                      supported = bool(title and quote and any(
                          re.sub(r"\s+", "", title) in re.sub(r"\s+", "", s["title"] + s["content"])
                          and re.sub(r"\s+", "", quote)[:20] in re.sub(r"\s+", "", s["content"])
                          for s in sources
                      ))
                      if not supported:
                          unverified = True
                      bases.append({
                          "title": title or "未确认依据",
                          "article": base.get("article"),
                          "source_quote": quote[:800],
                          "source_metadata": base.get("source_metadata") or {},
                          "verification_status": "retrieved_and_text_matched" if supported else "需人工复核"
                      })
                  if not bases:
                      unverified = True
                      bases = [{"title": "未检索到可核验的明确依据", "article": None, "source_quote": "", "source_metadata": {}, "verification_status": "需人工复核"}]
                  needs = bool(risk.get("needs_manual_review")) or level == "高" or unverified or not excerpt_ok
                  uncertainty = str(risk.get("uncertainty_reason") or "")
                  if unverified:
                      uncertainty = (uncertainty + "；法律依据未通过知识库文本匹配").strip("；")
                  if not excerpt_ok:
                      uncertainty = (uncertainty + "；原文摘录未通过分段文本匹配").strip("；")
                  loc = risk.get("location") if isinstance(risk.get("location"), dict) else {}
                  normalized.append({
                      "risk_id": "%s-R%02d" % ((chunk or {}).get("chunk_id", "UNKNOWN"), idx),
                      "risk_category": str(risk.get("risk_category") or "其他"),
                      "risk_level": level,
                      "title": str(risk.get("title") or "未命名风险")[:200],
                      "original_excerpt": excerpt,
                      "excerpt_verified": excerpt_ok,
                      "location": {
                          "chunk_id": (chunk or {}).get("chunk_id"),
                          "page_start": loc.get("page_start", (chunk or {}).get("page_start")),
                          "page_end": loc.get("page_end", (chunk or {}).get("page_end")),
                          "paragraph_start": loc.get("paragraph_start", (chunk or {}).get("paragraph_start")),
                          "paragraph_end": loc.get("paragraph_end", (chunk or {}).get("paragraph_end")),
                          "locator_label": loc.get("locator_label") or (chunk or {}).get("locator_label")
                      },
                      "issue": str(risk.get("issue") or "")[:2500],
                      "legal_bases": bases,
                      "possible_consequences": str(risk.get("possible_consequences") or "")[:2000],
                      "recommendation": str(risk.get("recommendation") or "")[:2500],
                      "replacement_clause": str(risk.get("replacement_clause") or "")[:3000],
                      "reasoning_summary": str(risk.get("reasoning_summary") or "")[:1200],
                      "needs_manual_review": needs,
                      "uncertainty_reason": uncertainty,
                      "confidence": max(0.0, min(1.0, float(risk.get("confidence") or 0.5)))
                  })
              payload = {
                  "chunk_id": (chunk or {}).get("chunk_id", "UNKNOWN"),
                  "analysis_status": "ok",
                  "failure_reason": "",
                  "risks": normalized,
                  "extracted_elements": parsed.get("extracted_elements") if isinstance(parsed.get("extracted_elements"), dict) else {},
                  "retrieval_trace": sources,
                  "needs_manual_review": any(x["needs_manual_review"] for x in normalized)
              }
              return {"result_json": json.dumps(payload, ensure_ascii=False)}
