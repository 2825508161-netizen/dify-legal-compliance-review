    - data:
        code: |
          import re

          def main(chunk: dict, declared_doc_type: str, industry: str, jurisdiction: str, focus_risk_types: str) -> dict:
              text = str((chunk or {}).get("text") or "")
              keywords = []
              rules = {
                  "数据隐私": r"个人信息|隐私|数据|出境|跨境|敏感信息|人脸|身份证|定位",
                  "劳动用工": r"员工|劳动|工资|加班|竞业|解除|社保",
                  "广告宣传": r"广告|宣传|最佳|最高级|国家级|治愈|有效率|收益|保本",
                  "合同责任": r"违约|免责|赔偿|终止|解除|管辖|争议|验收|付款",
                  "知识产权": r"著作权|商标|专利|知识产权|许可|授权",
                  "反腐败反洗钱": r"回扣|佣金|礼品|贿赂|洗钱|可疑交易|制裁"
              }
              for name, pattern in rules.items():
                  if re.search(pattern, text, flags=re.I):
                      keywords.append(name)
              query = (
                  "法域：%s；文档类型：%s；行业：%s；关注：%s；"
                  "本段主题：%s；检索与下列原文相关的现行法律、监管规定、公司制度和历史案例：%s"
              ) % (
                  jurisdiction, declared_doc_type, industry, focus_risk_types,
                  "、".join(keywords) if keywords else "一般法律合规",
                  re.sub(r"\s+", " ", text)[:1400]
              )
              return {"query": query}
        code_language: python3
        desc: 将用户参数、风险关键词和当前分段组合为知识库语义检索查询。
