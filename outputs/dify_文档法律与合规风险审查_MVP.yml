    - data:
        code: |
          import re

          MAX_CHARS = 5200
          MAX_CHUNKS = 100

          def clean(v):
              return (v or "").replace("\r\n", "\n").replace("\r", "\n").strip()

          def page_marker(line):
              for p in [r"^\s*\[PAGE\s*(\d+)\]\s*$", r"^\s*第\s*(\d+)\s*页\s*$", r"^\s*PAGE\s*(\d+)\s*$"]:
                  m = re.match(p, line, flags=re.I)
                  if m:
                      return int(m.group(1))
              return None

          def main(extracted_text: str) -> dict:
              text = clean(extracted_text)
              if not text:
                  return {
                      "chunks": [],
                      "document_char_count": 0,
                      "chunk_count": 0,
                      "locator_quality": "unavailable",
                      "preprocess_notice": "未提取到文本；请检查扫描件、加密文件或文件格式。"
                  }
              text = text.replace("\f", "\n\n[[PAGE_BREAK]]\n\n")
              blocks = [x.strip() for x in re.split(r"\n\s*\n+", text) if x.strip()]
              paras = []
              page = None
              para_no = 0
              for block in blocks:
                  if block == "[[PAGE_BREAK]]":
                      page = 1 if page is None else page + 1
                      continue
                  found = page_marker(block)
                  if found is not None:
                      page = found
                      continue
                  pieces = [block]
                  if len(block) > 2200:
                      pieces = [x.strip() for x in re.split(r"(?<=[。！？；;])\s*|\n+", block) if x.strip()]
                  for piece in pieces:
                      start = 0
                      while start < len(piece):
                          para_no += 1
                          paras.append({"n": para_no, "page": page, "text": piece[start:start+2000]})
                          start += 1900

              def loc(p):
                  if p["page"] is None:
                      return "第%s段" % p["n"]
                  return "第%s页·第%s段" % (p["page"], p["n"])

              chunks = []
              current = []
              size = 0
              def flush():
                  nonlocal current, size
                  if not current:
                      return
                  pages = [p["page"] for p in current if p["page"] is not None]
                  chunks.append({
                      "chunk_id": "C%03d" % (len(chunks)+1),
                      "locator_label": "%s-%s" % (loc(current[0]), loc(current[-1])),
                      "page_start": min(pages) if pages else None,
                      "page_end": max(pages) if pages else None,
                      "paragraph_start": current[0]["n"],
                      "paragraph_end": current[-1]["n"],
                      "text": "\n\n".join("[%s] %s" % (loc(p), p["text"]) for p in current)
                  })
                  current = current[-1:]
                  size = sum(len(p["text"])+20 for p in current)

              for p in paras:
                  if current and size + len(p["text"]) + 20 > MAX_CHARS:
                      flush()
                      if len(chunks) >= MAX_CHUNKS:
                          break
                  current.append(p)
                  size += len(p["text"]) + 20
              if current and len(chunks) < MAX_CHUNKS:
                  flush()
              has_page = any(p["page"] is not None for p in paras)
              notice = "文本已完成分页与段落定位。" if has_page else "原生提取未提供可靠分页；段落编号可追溯，页码显示 P?。"
              if len(chunks) >= MAX_CHUNKS:
                  notice += " 已达到 100 个分段上限，超长文档应拆分后重跑。"
              return {
                  "chunks": chunks,
                  "document_char_count": len(text),
                  "chunk_count": len(chunks),
                  "locator_quality": "page_and_paragraph" if has_page else "paragraph_only",
                  "preprocess_notice": notice
              }
        code_language: python3
        desc: 按约 5200 字分段，保留页码（若原始解析可提供）和段落编号；最多 100 段。
