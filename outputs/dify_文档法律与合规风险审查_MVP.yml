    - data:
        code: |
          import json
          import re
          from datetime import datetime, timezone

          SCORE = {"低": 1, "中": 2, "高": 3}

          def loads(v, d):
              try:
                  return json.loads(v)
              except Exception:
                  return d

          def norm(v):
              return re.sub(r"[\s，。；：、,.!?！？:;（）()\[\]\"'“”‘’]+", "", str(v or "")).lower()

          def similar(a, b):
              a, b = norm(a), norm(b)
              if not a or not b:
                  return False
              if a in b or b in a:
                  return True
              sa, sb = set(a), set(b)
              return len(sa & sb) / max(1, len(sa | sb)) >= 0.72

          def unique(items, key):
              out, seen = [], set()
              for item in items:
                  k = key(item)
                  if k not in seen:
                      seen.add(k)
                      out.append(item)
              return out

          def render(report):
              c = report["risk_summary"]["counts"]
              lines = [
                  "# 文档法律与合规风险审查报告", "",
                  "> 本报告由自动化系统辅助生成，不构成正式法律意见。所有高风险项及标记“需人工复核”的依据必须交由法务确认。", "",
                  "## 一、执行摘要", "",
                  "- 审查时间（UTC）：%s" % report["report_meta"]["reviewed_at"],
                  "- 声明文档类型：%s" % report["review_parameters"]["declared_doc_type"],
                  "- 适用法域：%s" % report["review_parameters"]["jurisdiction"],
                  "- 风险总数：%s（高 %s / 中 %s / 低 %s）" % (c["total"], c["high"], c["medium"], c["low"]),
                  "- 定位质量：%s" % report["report_meta"]["locator_quality"],
                  "- 预处理提示：%s" % report["report_meta"]["preprocess_notice"], "",
                  report["risk_summary"]["executive_summary"], "",
                  "## 二、重点整改清单", ""
              ]
              if report["priority_remediation"]:
                  for i, item in enumerate(report["priority_remediation"], 1):
                      lines.append("%s. **[%s] %s**：%s（%s）" % (i, item["risk_level"], item["title"], item["recommendation"], item["location"]))
              else:
                  lines.append("- 未识别出明确风险；仍建议人工抽查关键条款与知识库覆盖范围。")
              lines += ["", "## 三、风险明细", ""]
              for r in report["risks"]:
                  lines += [
                      "### %s [%s] %s" % (r["risk_id"], r["risk_level"], r["title"]), "",
                      "- 风险类别：%s" % r["risk_category"],
                      "- 原文位置：%s" % (r.get("location", {}).get("locator_label") or "未定位"),
                      "- 原文摘录：%s" % (r.get("original_excerpt") or "未提供"),
                      "- 问题说明：%s" % (r.get("issue") or "未提供"),
                      "- 可能后果：%s" % (r.get("possible_consequences") or "未提供"),
                      "- 修改建议：%s" % (r.get("recommendation") or "未提供"),
                      "- 建议替换条款：%s" % (r.get("replacement_clause") or "不适用/需法务起草"),
                      "- 判断理由摘要：%s" % (r.get("reasoning_summary") or "未提供"),
                      "- 人工复核：%s%s" % ("是" if r.get("needs_manual_review") else "否", ("（%s）" % r.get("uncertainty_reason")) if r.get("uncertainty_reason") else ""),
                      "", "法律/制度依据：", ""
                  ]
                  for b in r.get("legal_bases") or []:
                      lines.append("- %s %s｜状态：%s｜依据摘录：%s" % (b.get("title"), b.get("article") or "", b.get("verification_status"), b.get("source_quote") or "无"))
                  lines.append("")
              lines += ["## 四、未完成或需复核的分段", ""]
              if report["unresolved_chunks"]:
                  for x in report["unresolved_chunks"]:
                      lines.append("- %s：%s" % (x["chunk_id"], x["failure_reason"]))
              else:
                  lines.append("- 无。")
              lines += ["", "## 五、可追溯性说明", "",
                        "- 每项风险保留分段、页码（若可用）、段落范围、原文、检索资料和判断理由摘要。",
                        "- 页码为 P? 表示原生解析未保留可靠分页，段落编号仍可回查。",
                        "- 检索命中不等于法律适用结论，正式使用须由法务核验现行有效文本。"]
              return "\n".join(lines)

          def main(iteration_results: list, declared_doc_type: str, industry: str, jurisdiction: str, strictness: str, focus_risk_types: str, locator_quality: str, preprocess_notice: str, document_char_count: int, chunk_count: int) -> dict:
              risks, unresolved, traces, elements = [], [], [], {}
              for raw in iteration_results or []:
                  item = loads(raw, {})
                  if item.get("analysis_status") != "ok":
                      unresolved.append({"chunk_id": item.get("chunk_id", "UNKNOWN"), "failure_reason": item.get("failure_reason", "未知错误")})
                      continue
                  risks += item.get("risks") or []
                  traces += item.get("retrieval_trace") or []
                  for k, v in (item.get("extracted_elements") or {}).items():
                      vals = v if isinstance(v, list) else [v]
                      elements.setdefault(k, [])
                      elements[k] += [x for x in vals if x not in (None, "", [], {})]
              merged = []
              for r in risks:
                  found = None
                  for e in merged:
                      if r.get("risk_category") == e.get("risk_category") and (similar(r.get("original_excerpt"), e.get("original_excerpt")) or similar(r.get("title"), e.get("title"))):
                          found = e
                          break
                  if found:
                      if SCORE.get(r.get("risk_level"), 0) > SCORE.get(found.get("risk_level"), 0):
                          found["risk_level"] = r["risk_level"]
                      found["needs_manual_review"] = bool(found.get("needs_manual_review") or r.get("needs_manual_review"))
                      found["legal_bases"] = unique((found.get("legal_bases") or []) + (r.get("legal_bases") or []), lambda x: (norm(x.get("title")), norm(x.get("article")), norm(x.get("source_quote"))[:80]))
                      found.setdefault("duplicate_locations", []).append(r.get("location") or {})
                  else:
                      r["duplicate_locations"] = []
                      merged.append(r)
              merged.sort(key=lambda x: (-SCORE.get(x.get("risk_level"), 0), x.get("location", {}).get("paragraph_start") or 999999))
              for i, r in enumerate(merged, 1):
                  r["risk_id"] = "RISK-%03d" % i
              for k, vals in elements.items():
                  elements[k] = unique(vals, lambda x: norm(x))[:50]
              high = sum(1 for x in merged if x.get("risk_level") == "高")
              medium = sum(1 for x in merged if x.get("risk_level") == "中")
              low = sum(1 for x in merged if x.get("risk_level") == "低")
              summary = "系统共识别 %s 项风险，其中高风险 %s 项、中风险 %s 项、低风险 %s 项。" % (len(merged), high, medium, low)
              if high:
                  summary += " 高风险项不得自动定稿，必须由法务结合完整原文与最新有效法规复核。"
              if unresolved:
                  summary += " 另有 %s 个分段未完成分析，应人工补审。" % len(unresolved)
              priority = []
              for r in merged:
                  if r.get("risk_level") in ("高", "中") and len(priority) < 10:
                      priority.append({"risk_id": r["risk_id"], "risk_level": r["risk_level"], "title": r["title"], "recommendation": r.get("recommendation") or "交由法务复核", "location": r.get("location", {}).get("locator_label") or "未定位"})
              report = {
                  "report_meta": {
                      "schema_version": "1.0.0",
                      "generator": "Dify 文档法律与合规风险审查 MVP",
                      "reviewed_at": datetime.now(timezone.utc).isoformat(),
                      "locator_quality": locator_quality,
                      "preprocess_notice": preprocess_notice,
                      "document_char_count": document_char_count,
                      "chunk_count": chunk_count,
                      "legal_disclaimer": "本报告仅供内部辅助审查，不构成正式法律意见。"
                  },
                  "review_parameters": {"declared_doc_type": declared_doc_type, "industry": industry, "jurisdiction": jurisdiction, "strictness": strictness, "focus_risk_types": focus_risk_types},
                  "document_profile": {"aggregated_elements": elements},
                  "risk_summary": {"counts": {"total": len(merged), "high": high, "medium": medium, "low": low}, "executive_summary": summary, "high_risk_requires_legal_review": high > 0, "unresolved_chunk_count": len(unresolved)},
                  "priority_remediation": priority,
                  "risks": merged,
                  "unresolved_chunks": unresolved,
                  "retrieval_trace": unique(traces, lambda x: (norm(x.get("title")), norm(x.get("content"))[:120]))[:100]
              }
              return {
                  "report_markdown": render(report),
                  "report_json": json.dumps(report, ensure_ascii=False, indent=2),
                  "high_risk_count": high,
                  "manual_review_required": bool(high or unresolved or any(x.get("needs_manual_review") for x in merged))
              }
        code_language: python3
