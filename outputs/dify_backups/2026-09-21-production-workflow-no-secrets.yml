          \                else \"第%s页·第%s—%s段\"\n                % (page_start, paragraph_start,\
          \ paragraph_end)\n            )\n        return \"第%s页·第%s段—第%s页·第%s段\"\
          \ % (\n            page_start,\n            paragraph_start,\n         \
          \   page_end,\n            paragraph_end,\n        )\n\n    # Backward compatibility\
          \ for cached results produced before Chinese locators.\n    legacy = str(location.get(\"\
          locator_label\") or \"\")\n    match = re.fullmatch(r\"P\\?/¶(\\d+)(?:-P\\\
          ?/¶(\\d+))?\", legacy)\n    if match:\n        start, end = match.group(1),\
          \ match.group(2) or match.group(1)\n        return \"第%s段\" % start if start\
          \ == end else \"第%s—%s段\" % (start, end)\n    return legacy or \"位置待核验\"\
          \n\n\ndef _dedupe_bucket(category):\n    # These labels often describe the\
          \ same contract defect from different\n    # angles. Dedupe them by exact\
          \ source excerpt, while keeping specialist\n    # risks such as data/privacy\
          \ or employment separate.\n    general_contract = {\n        \"合同权利义务\"\
          ,\n        \"价款与税务\",\n        \"期限与终止\",\n        \"违约责任\",\n        \"\
          争议解决\",\n        \"主体与授权\",\n    }\n    return \"合同通用\" if category in general_contract\
          \ else category\n\n\ndef main(iteration_results: list, declared_doc_type:\
          \ str, jurisdiction: str) -> dict:\n    risks = []\n    traces = []\n  \
          \  unresolved = []\n    warnings = []\n    for raw in iteration_results\
          \ or []:\n        item = _load(raw)\n        if item.get(\"analysis_status\"\
          ) != \"ok\":\n            unresolved.append(\n                {\n      \
          \              \"chunk_id\": item.get(\"chunk_id\", \"UNKNOWN\"),\n    \
          \                \"failure_reason\": item.get(\"failure_reason\", \"未知错误\"\
          ),\n                }\n            )\n            continue\n        risks.extend(item.get(\"\
          risks\") or [])\n        traces.extend(item.get(\"retrieval_trace\") or\
          \ [])\n        if item.get(\"analysis_warning\"):\n            warnings.append(\n\
          \                {\n                    \"chunk_id\": item.get(\"chunk_id\"\
          , \"UNKNOWN\"),\n                    \"message\": item.get(\"analysis_warning\"\
          ),\n                }\n            )\n\n    deduplicated = []\n    seen\
          \ = set()\n    for risk in risks:\n        category = (risk.get(\"risk_category\"\
          ) or \"其他\").strip()\n        key = (\n            _dedupe_bucket(category),\n\
          \            (\n                risk.get(\"original_excerpt\")\n       \
          \         or risk.get(\"title\")\n                or \"\"\n            ).strip().lower(),\n\
          \        )\n        if key in seen:\n            continue\n        seen.add(key)\n\
          \        deduplicated.append(risk)\n\n    score = {\"高\": 3, \"中\": 2, \"\
          低\": 1}\n    deduplicated.sort(\n        key=lambda risk: -score.get(risk.get(\"\
          risk_level\"), 0)\n    )\n    for index, risk in enumerate(deduplicated,\
          \ start=1):\n        risk[\"risk_id\"] = \"RISK-%03d\" % index\n       \
          \ risk.setdefault(\"location\", {})[\"locator_label\"] = _display_location(\n\
          \            risk.get(\"location\")\n        )\n\n    counts = {\n     \
          \   level: sum(\n            1 for risk in deduplicated if risk.get(\"risk_level\"\
          ) == level\n        )\n        for level in (\"高\", \"中\", \"低\")\n    }\n\
          \    manual_review_required = bool(\n        unresolved\n        or counts[\"\
          高\"]\n        or any(risk.get(\"needs_manual_review\") for risk in deduplicated)\n\
          \    )\n    summary = \"共识别 %d 项风险：高 %d 项、中 %d 项、低 %d 项。\" % (\n       \
          \ len(deduplicated),\n        counts[\"高\"],\n        counts[\"中\"],\n \
          \       counts[\"低\"],\n    )\n    if manual_review_required:\n        summary\
          \ += (\n            \" 高风险或依据不确定项必须由法务结合完整原文和最新有效法规复核。\"\n        )\n\n\
          \    report = {\n        \"report_meta\": {\n            \"schema_version\"\
          : \"1.0.0\",\n            \"generated_at\": datetime.now(timezone.utc).isoformat(),\n\
          \            \"legal_disclaimer\": \"仅供内部辅助审查，不构成正式法律意见。\",\n        },\n\
          \        \"review_parameters\": {\n            \"declared_doc_type\": declared_doc_type,\n\
          \            \"jurisdiction\": jurisdiction,\n        },\n        \"risk_summary\"\
          : {\n            \"counts\": {\n                \"total\": len(deduplicated),\n\
          \                \"high\": counts[\"高\"],\n                \"medium\": counts[\"\
          中\"],\n                \"low\": counts[\"低\"],\n            },\n       \
          \     \"executive_summary\": summary,\n            \"manual_review_required\"\
          : manual_review_required,\n        },\n        \"priority_remediation\"\
          : [\n            {\n                \"risk_id\": risk.get(\"risk_id\"),\n\
          \                \"level\": risk.get(\"risk_level\"),\n                \"\
          title\": risk.get(\"title\"),\n                \"location\": (risk.get(\"\
          location\") or {}).get(\n                    \"locator_label\"\n       \
          \         ),\n                \"action\": risk.get(\"recommendation\"),\n\
          \            }\n            for risk in deduplicated\n            if risk.get(\"\
          risk_level\") in (\"高\", \"中\")\n        ][:10],\n        \"risks\": deduplicated,\n\
          \        \"unresolved_chunks\": unresolved,\n        \"processing_warnings\"\
          : warnings,\n        \"retrieval_trace\": traces[:100],\n    }\n\n    lines\
          \ = [\n        \"# 文档法律与合规风险审查报告\",\n        \"\",\n        \"> \" + report[\"\
          report_meta\"][\"legal_disclaimer\"],\n        \"\",\n        \"## 执行摘要\"\
          ,\n        \"\",\n        summary,\n        \"\",\n        \"## 重点整改清单\"\
          ,\n        \"\",\n    ]\n    if report[\"priority_remediation\"]:\n    \
          \    for item in report[\"priority_remediation\"]:\n            lines.append(\n\
          \                \"- **%s｜%s**（%s）：%s\"\n                % (\n         \
          \           item[\"level\"],\n                    item[\"title\"],\n   \
          \                 item[\"location\"] or \"位置待核验\",\n                   \
          \ item[\"action\"] or \"交由法务复核\",\n                )\n            )\n  \
          \  else:\n        lines.append(\"- 未发现需列入重点整改清单的项目。\")\n\n    if warnings:\n\
          \        lines.extend([\"\", \"## 处理提示\", \"\"])\n        for warning in\
          \ warnings:\n            lines.append(\n                \"- %s：%s\"\n  \
          \              % (warning.get(\"chunk_id\"), warning.get(\"message\"))\n\
          \            )\n\n    lines += [\"\", \"## 风险明细\", \"\"]\n    for risk in\
          \ deduplicated:\n        location = (risk.get(\"location\") or {}).get(\n\
          \            \"locator_label\"\n        ) or \"位置待核验\"\n        lines +=\
          \ [\n            \"### %s｜%s｜%s\"\n            % (\n                risk.get(\"\
          risk_id\"),\n                risk.get(\"risk_level\"),\n               \
          \ risk.get(\"title\"),\n            ),\n            \"\",\n            \"\
          - 类别：%s\" % risk.get(\"risk_category\", \"其他\"),\n            \"- 位置：%s\"\
          \ % location,\n            \"- 原文：> %s\"\n            % (risk.get(\"original_excerpt\"\
          ) or \"未提供\"),\n            \"- 问题：%s\" % (risk.get(\"issue\") or \"\"),\n\
          \            \"- 可能后果：%s\"\n            % (risk.get(\"possible_consequences\"\
          ) or \"\"),\n            \"- 修改建议：%s\"\n            % (risk.get(\"recommendation\"\
          ) or \"交由法务复核\"),\n            \"- 建议替换条款：%s\"\n            % (risk.get(\"\
          replacement_clause\") or \"无\"),\n            \"- 判断理由摘要：%s\"\n        \
          \    % (risk.get(\"reasoning_summary\") or \"\"),\n            \"- 人工复核：%s\"\
          \n            % (\n                \"是\"\n                if risk.get(\"\
          needs_manual_review\")\n                or risk.get(\"risk_level\") == \"\
          高\"\n                else \"否\"\n            ),\n            \"\",\n   \
          \         \"法律依据：\",\n        ]\n        for base in risk.get(\"legal_bases\"\
          ) or []:\n            article = (\n                \" \" + str(base.get(\"\
          article\"))\n                if base.get(\"article\")\n                else\
          \ \"\"\n            )\n            lines.append(\n                \"- %s%s｜%s\"\
          \n                % (\n                    base.get(\"title\") or \"未确认依据\"\
          ,\n                    article,\n                    base.get(\"verification_status\"\
          ) or \"需人工复核\",\n                )\n            )\n        lines.append(\"\
          \")\n\n    if unresolved:\n        lines += [\n            \"## 未完成分段\"\
          ,\n            \"\",\n            json.dumps(unresolved, ensure_ascii=False),\n\
          \        ]\n\n    return {\n        \"report_markdown\": \"\\n\".join(lines),\n\
          \        \"report_json\": json.dumps(\n            report, ensure_ascii=False,\
          \ indent=2\n        ),\n        \"high_risk_count\": counts[\"高\"],\n  \
          \      \"manual_review_required\": manual_review_required,\n    }\n    "
