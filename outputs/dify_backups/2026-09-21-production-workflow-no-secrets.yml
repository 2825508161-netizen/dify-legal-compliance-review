    - data:
        code: "import re\n\n\ndef main(chunk: dict, focus_risk_types: str = \"全部\"\
          ) -> dict:\n    text = re.sub(r\"\\s+\", \" \", str((chunk or {}).get(\"\
          text\") or \"\"))\n\n    rules = [\n        (r\"格式条款|单方(?:面)?(?:解释|修改|终止|解除)|免责|不承担|概不负责|放弃.*权利\"\
          , \"民法典 格式条款 提示说明 免责条款 无效\"),\n        (r\"违约|赔偿|责任上限|违约金|延期|逾期|交付|验收|付款|预付款\"\
          , \"民法典 合同履行 违约责任 损失赔偿\"),\n        (r\"自动续期|续约|有效期|期限|终止|解除\", \"民法典 合同期限\
          \ 解除权 自动续期\"),\n        (r\"管辖|仲裁|争议解决|诉讼\", \"民事诉讼法 协议管辖 实际联系\"),\n   \
          \     (r\"个人信息|隐私|数据|跨境|出境|用户画像|生物识别\", \"个人信息保护法 告知同意 最小必要 处理规则 跨境提供\"\
          ),\n        (r\"员工|劳动|加班|工资|竞业|解除劳动|试用期\", \"劳动合同法 劳动用工 工资 加班 解除 竞业限制\"\
          ),\n        (r\"广告|宣传|第一|最佳|国家级|保证收益|绝对化\", \"广告法 虚假广告 绝对化用语\"),\n     \
          \   (r\"著作权|商标|专利|知识产权|源代码|成果归属\", \"著作权法 商标法 知识产权 权利归属 侵权责任\"),\n     \
          \   (r\"回扣|佣金|招待|礼品|反腐败|商业贿赂\", \"反不正当竞争法 商业贿赂\"),\n        (r\"洗钱|客户身份|受益所有人|可疑交易\"\
          , \"反洗钱法 客户尽职调查 可疑交易\"),\n    ]\n\n    matched = [query for pattern, query\
          \ in rules if re.search(pattern, text)]\n    focus = re.sub(r\"[，、；;|/]+\"\
