    - data:
        code: "import re\n\n\nMAX_CHARS = 5500\nMAX_PARAGRAPHS = 5\nOVERLAP_PARAGRAPHS\
          \ = 1\nMAX_CHUNKS = 120\n\n\ndef _clean(value):\n    return (value or \"\
          \").replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n\n\n\
          def _detect_page_marker(line):\n    patterns = [\n        r\"^\\s*\\[PAGE\\\
          s*(\\d+)\\]\\s*$\",\n        r\"^\\s*[-—]{2,}\\s*PAGE\\s*(\\d+)\\s*[-—]{2,}\\\
          s*$\",\n        r\"^\\s*第\\s*(\\d+)\\s*页\\s*$\",\n        r\"^\\s*PAGE\\\
          s*(\\d+)\\s*$\",\n    ]\n    for pattern in patterns:\n        match = re.match(pattern,\
          \ line, flags=re.IGNORECASE)\n        if match:\n            return int(match.group(1))\n\
          \    return None\n\n\ndef _split_paragraphs(text):\n    # Form feed is the\
          \ only page delimiter that some PDF parsers preserve.\n    text = text.replace(\"\
          \\f\", \"\\n\\n[[PAGE_BREAK]]\\n\\n\")\n    blocks = re.split(r\"\\n\\s*\\\
          n+\", text)\n    paragraphs = []\n    page = None\n    paragraph_no = 0\n\
          \n    for block in blocks:\n        block = block.strip()\n        if not\
          \ block:\n            continue\n        if block == \"[[PAGE_BREAK]]\":\n\
          \            page = 1 if page is None else page + 1\n            continue\n\
          \n        marker_page = _detect_page_marker(block)\n        if marker_page\
          \ is not None:\n            page = marker_page\n            continue\n\n\
          \        # If extraction only preserved line breaks, keep headings and clauses\
          \ locatable.\n        pieces = [block]\n        if len(block) > 2200:\n\
          \            pieces = [\n                item.strip()\n                for\
          \ item in re.split(r\"(?<=[。！？；;])\\s*|\\n+\", block)\n                if\
          \ item.strip()\n            ]\n\n        for piece in pieces:\n        \
          \    if len(piece) <= 2200:\n                paragraph_no += 1\n       \
          \         paragraphs.append(\n                    {\n                  \
          \      \"paragraph_no\": paragraph_no,\n                        \"page\"\
          : page,\n                        \"text\": piece,\n                    }\n\
          \                )\n                continue\n\n            # A single huge\
          \ paragraph is split mechanically while retaining paragraph identity.\n\
          \            start = 0\n            part = 1\n            while start <\
          \ len(piece):\n                paragraph_no += 1\n                paragraphs.append(\n\
          \                    {\n                        \"paragraph_no\": paragraph_no,\n\
          \                        \"page\": page,\n                        \"text\"\
          : piece[start : start + 2000],\n                        \"part\": part,\n\
          \                    }\n                )\n                start += 1900\n\
          \                part += 1\n\n    return paragraphs\n\n\ndef _locator(paragraph):\n\
          \    \"\"\"Return a readable locator that can also be copied into the report.\"\
          \"\"\n    page = paragraph.get(\"page\")\n    paragraph_no = paragraph[\"\
          paragraph_no\"]\n    if page is None:\n        return \"第%s段\" % paragraph_no\n\
          \    return \"第%s页·第%s段\" % (page, paragraph_no)\n\n\ndef _range_locator(first,\
          \ last):\n    first_page = first.get(\"page\")\n    last_page = last.get(\"\
          page\")\n    first_paragraph = first[\"paragraph_no\"]\n    last_paragraph\
          \ = last[\"paragraph_no\"]\n\n    if first_paragraph == last_paragraph:\n\
          \        return _locator(first)\n    if first_page is None and last_page\
          \ is None:\n        return \"第%s—%s段\" % (first_paragraph, last_paragraph)\n\
          \    if first_page is not None and first_page == last_page:\n        return\
          \ \"第%s页·第%s—%s段\" % (\n            first_page,\n            first_paragraph,\n\
          \            last_paragraph,\n        )\n    return \"%s—%s\" % (_locator(first),\
          \ _locator(last))\n\n\ndef _build_chunks(paragraphs):\n    chunks = []\n\
          \    current = []\n    current_chars = 0\n\n    def flush():\n        nonlocal\
          \ current, current_chars\n        if not current:\n            return\n\
          \        chunk_no = len(chunks) + 1\n        first = current[0]\n      \
          \  last = current[-1]\n        pages = [p[\"page\"] for p in current if\
          \ p.get(\"page\") is not None]\n        decorated = \"\\n\\n\".join(\n \
          \           \"[%s] %s\" % (_locator(p), p[\"text\"]) for p in current\n\
          \        )\n        chunks.append(\n            {\n                \"chunk_id\"\
          : \"C%03d\" % chunk_no,\n                \"locator_label\": _range_locator(first,\
          \ last),\n                \"page_start\": min(pages) if pages else None,\n\
          \                \"page_end\": max(pages) if pages else None,\n        \
          \        \"paragraph_start\": first[\"paragraph_no\"],\n               \
          \ \"paragraph_end\": last[\"paragraph_no\"],\n                \"text\":\
          \ decorated,\n            }\n        )\n        overlap = current[-OVERLAP_PARAGRAPHS:]\
          \ if OVERLAP_PARAGRAPHS else []\n        current = list(overlap)\n     \
          \   current_chars = sum(len(p[\"text\"]) + 24 for p in current)\n\n    for\
          \ paragraph in paragraphs:\n        projected = current_chars + len(paragraph[\"\
          text\"]) + 24\n        # Limit both text size and clause count. Legal review\
          \ output is often\n        # much longer than its input; smaller batches\
          \ prevent the model from\n        # exhausting its response limit and returning\
          \ truncated JSON.\n        if current and (\n            projected > MAX_CHARS\
          \ or len(current) >= MAX_PARAGRAPHS\n        ):\n            flush()\n \
          \           if len(chunks) >= MAX_CHUNKS:\n                break\n     \
          \   current.append(paragraph)\n        current_chars += len(paragraph[\"\
          text\"]) + 24\n\n    if current and len(chunks) < MAX_CHUNKS:\n        flush()\n\
          \n    return chunks\n\n\ndef main(\n    extracted_text: str,\n    declared_doc_type:\
          \ str = \"自动识别\",\n    industry: str = \"未指定\",\n    jurisdiction: str =\
          \ \"中国大陆\",\n    strictness: str = \"标准\",\n    focus_risk_types: str =\
          \ \"全部\",\n) -> dict:\n    text = _clean(extracted_text)\n    if not text:\n\
          \        return {\n            \"chunks\": [],\n            \"document_head\"\
          : \"\",\n            \"document_char_count\": 0,\n            \"chunk_count\"\
          : 0,\n            \"locator_quality\": \"unavailable\",\n            \"\
          preprocess_notice\": \"未提取到文本，请检查文件是否为扫描件、加密文件或不受支持的格式。\",\n        }\n\n\
          \    paragraphs = _split_paragraphs(text)\n    chunks = _build_chunks(paragraphs)\n\
          \    has_page = any(p.get(\"page\") is not None for p in paragraphs)\n \
          \   truncated = len(chunks) >= MAX_CHUNKS and chunks[-1][\"paragraph_end\"\
          ] < len(paragraphs)\n\n    header = (\n        \"用户声明文档类型：%s\\n所属行业：%s\\\
          n适用法域：%s\\n\"\n        \"审查严格程度：%s\\n关注风险：%s\\n\\n\"\n        % (\n    \
          \        declared_doc_type,\n            industry,\n            jurisdiction,\n\
          \            strictness,\n            focus_risk_types,\n        )\n   \
          \ )\n    head_body = \"\\n\\n\".join(\n        \"[%s] %s\" % (_locator(p),\
          \ p[\"text\"]) for p in paragraphs\n    )[:12000]\n\n    notices = []\n\
          \    if not has_page:\n        notices.append(\n            \"Dify 原生文档提取结果未提供可靠分页标记；本次按中文段落编号定位。需要精确页码时，请接入能够保留分页信息的解析服务。\"\
          \n        )\n    if truncated:\n        notices.append(\n            \"\
          文档超过 MVP 的 120 个分段上限，尾部未进入模型审查；请拆分文档后重跑。\"\n        )\n\n    return {\n\
          \        \"chunks\": chunks,\n        \"document_head\": header + head_body,\n\
          \        \"document_char_count\": len(text),\n        \"chunk_count\": len(chunks),\n\
          \        \"locator_quality\": \"page_and_paragraph\" if has_page else \"\
          paragraph_only\",\n        \"preprocess_notice\": \"；\".join(notices) if\
          \ notices else \"文本已完成分页/段落定位。\",\n    }\n    "
        code_language: python3
