          \     parsed, _ = decoder.raw_decode(value[index:])\n        except Exception:\n\
          \            continue\n        if isinstance(parsed, dict):\n          \
          \  parsed_candidates.append(parsed)\n\n    # Keep the final answer when\
          \ reasoning contains earlier JSON examples.\n    for parsed in reversed(parsed_candidates):\n\
          \        if isinstance(parsed.get(\"risks\"), list):\n            return\
          \ parsed\n        for key in (\"result\", \"data\", \"analysis\"):\n   \
          \         nested = parsed.get(key)\n            if isinstance(nested, dict)\
          \ and isinstance(nested.get(\"risks\"), list):\n                return nested\n\
          \n    # Backward compatibility for Flash responses that return a bare risk\
