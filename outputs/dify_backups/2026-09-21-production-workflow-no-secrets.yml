          \ DeepSeek reasoning can contain an\n    # unmatched example brace before\
          \ the final, otherwise valid JSON object.\n    decoder = json.JSONDecoder()\n\
          \    parsed_candidates = []\n    for index, char in enumerate(value):\n\
