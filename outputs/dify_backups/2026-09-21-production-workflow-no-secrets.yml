    - data:
        code: "import json\n\n\ndef _load(value):\n    if isinstance(value, str):\n\
          \        try:\n            return json.loads(value)\n        except Exception:\n\
          \            return {}\n    return value if isinstance(value, dict) else\
          \ {}\n\n\ndef main(api_body: str, unused_status: int = 200) -> dict:\n \
          \   payload = _load(api_body)\n    if isinstance(payload.get(\"body\"),\
          \ str):\n        payload = _load(payload[\"body\"])\n\n    records = payload.get(\"\
          records\")\n    if not isinstance(records, list):\n        records = []\n\
          \n    sources = []\n    context_blocks = []\n    for index, record in enumerate(records[:8],\
          \ start=1):\n        if not isinstance(record, dict):\n            continue\n\
          \        segment = record.get(\"segment\") or {}\n        document = segment.get(\"\
          document\") or {}\n        content = str(segment.get(\"content\") or record.get(\"\
          content\") or \"\").strip()\n        if not content:\n            continue\n\
          \        title = str(\n            document.get(\"name\")\n            or\
          \ segment.get(\"document_name\")\n            or \"未命名知识库资料\"\n        )\n\
          \        metadata = {\n            \"dataset_id\": segment.get(\"dataset_id\"\
          ),\n            \"document_id\": segment.get(\"document_id\") or document.get(\"\
          id\"),\n            \"document_name\": title,\n            \"segment_id\"\
          : segment.get(\"id\"),\n            \"position\": segment.get(\"position\"\
          ),\n            \"score\": record.get(\"score\"),\n        }\n        sources.append(\n\
          \            {\n                \"title\": title,\n                \"content\"\
          : content[:3000],\n                \"metadata\": metadata,\n           \
          \ }\n        )\n        context_blocks.append(\n            \"[检索来源 {index}]\\\
          n\"\n            \"资料名称：{title}\\n\"\n            \"分段位置：{position}\\n\"\
          \n            \"相关度：{score}\\n\"\n            \"内容：\\n{content}\".format(\n\
          \                index=index,\n                title=title,\n          \
          \      position=metadata.get(\"position\"),\n                score=metadata.get(\"\
          score\"),\n                content=content[:3000],\n            )\n    \
          \    )\n\n    if context_blocks:\n        context_text = (\n           \
          \ \"以下内容来自法律与合规知识库。仅可引用其中明确出现的法规名称、\"\n            \"条款编号和文字；不得补写未出现的法条。\\\
          n\\n\"\n            + \"\\n\\n---\\n\\n\".join(context_blocks)\n       \
          \ )\n    else:\n        context_text = (\n            \"知识库本次未返回可用片段。所有法律依据必须标记为“需人工复核”，\"\
          \n            \"不得凭模型记忆补写法条或案例编号。\"\n        )\n\n    return {\n       \
          \ \"context_text\": context_text,\n        \"source_items\": sources,\n\
          \        \"source_count\": len(sources),\n    }\n"
