          \    title_key = re.sub(r\"\\s+\", \"\", title)\n    quote_key = re.sub(r\"\
          \\s+\", \"\", quote)\n    article_key = re.sub(r\"\\s+\", \"\", article)\n\
          \    return any(\n        title_key in hay\n        and quote_key[:24] in\
          \ hay\n        and (not article_key or article_key in hay)\n        for\
          \ hay in haystacks\n    )\n\n\ndef _fallback(chunk, reason, sources):\n\
