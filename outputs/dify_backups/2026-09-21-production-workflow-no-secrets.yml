          \ \"content\": str(item.get(\"content\") or \"\")[:1800],\n            \
          \    \"metadata\": metadata,\n            }\n        )\n    return sources\n\
          \n\ndef _text_in_chunk(excerpt, chunk_text):\n    if not excerpt:\n    \
          \    return False\n    normalize = lambda s: re.sub(r\"\\s+\", \"\", str(s))\n\
          \    return normalize(excerpt) in normalize(chunk_text)\n\n\ndef _law_supported(base,\
